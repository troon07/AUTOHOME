; PlatformIO Project Configuration File for ClawGrid V2.0
; Targets 2 x ESP32-S3-N16R8 (16MB Quad Flash, 8MB Octal PSRAM)

[platformio]
default_envs = node_intelligence
src_dir = firmware

[env]
platform = espressif32 @ 6.6.0
board = clawgrid_s3_n16r8
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions_n16r8.csv
board_build.arduino.memory_type = qio_opi
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -I firmware/common/protocol
    -I firmware/common/safety_kernel
    -I firmware/common/config
    -I firmware/common/neural_nlp
    -I firmware/common/runtime

[env:node_voice]
build_src_filter = +<node_voice/src/*> +<common/protocol/*> +<common/safety_kernel/*> +<common/runtime/*>
upload_port = COM5

[env:node_intelligence]
build_src_filter = +<node_intelligence/src/*> +<common/protocol/*> +<common/neural_nlp/*> +<common/runtime/*>
upload_port = COM7

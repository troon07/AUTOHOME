[platformio]
default_envs = speech_intelligence
boards_dir = ../boards
src_dir = main

[env:speech_intelligence]
platform = espressif32 @ 6.6.0
framework = espidf
platform_packages =
    platformio/framework-espidf@3.40407.240606
    espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
    espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
board = clawgrid_s3_n16r8
board_build.partitions = ../partitions_n16r8.csv
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.sdkconfig_defaults = ../native/sdkconfig.defaults, sdkconfig.defaults
monitor_speed = 115200
upload_speed = 115200
upload_port = COM7
build_flags = -DCLAWGRID_NATIVE_IDF=1 -DCLAWGRID_NODE_B=1 -DCLAWGRID_ESP_SR=1
